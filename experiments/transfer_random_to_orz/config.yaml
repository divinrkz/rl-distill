run_name: transfer_random_to_orz
out_base: experiments
target:
  id: orz
  model_name: Open-Reasoner-Zero/Open-Reasoner-Zero-7B
  format: orz
dataset:
  name: HuggingFaceH4/MATH-500
  split: test
labeler:
  model_name: Qwen/Qwen2.5-32B-Instruct-AWQ
  generation:
    temperature: 0.0
    top_p: 1.0
    max_tokens: 4096
    seed: 0
  vllm:
    quantization: awq_marlin
    dtype: float16
    gpu_memory_utilization: 0.9
    max_model_len: 32768
    trust_remote_code: true
steer:
  vectors_from: experiments/random_vectors.pt
  categories:
  - backtracking
  - uncertainty-estimation
  layers:
  - 12
  - 13
  - 14
  - 15
  - 16
  - 17
  - 18
  coeffs:
  - 0
  - 0.2
  - 0.4
  - 0.8
  eval_indices:
  - 20
  - 21
  - 22
  gen:
    max_new_tokens: 512
    do_sample: false
hf:
  dtype: bfloat16
categories:
- initializing
- deduction
- adding-knowledge
- example-testing
- uncertainty-estimation
- backtracking
formats:
  orz:
    chat: false
    prompt_template: 'A conversation between User and Assistant. The User asks a question,
      and the Assistant solves it. The Assistant first thinks about the reasoning
      process and then provides the answer. The reasoning process is enclosed within
      <think> </think> and the final answer within <answer> </answer>, with the answer
      in \boxed{{}}.

      User: {problem}

      Assistant: <think>

      '
    think_open: <think>
    think_close: </think>
    answer_open: <answer>
    answer_close: </answer>
    think_open_in_prompt: true
  openthinker:
    chat: true
    system_prompt: null
    user_template: '{problem}


      Put your final answer within \boxed{{}}.'
    think_open: <|begin_of_thought|>
    think_close: <|end_of_thought|>
    answer_open: <|begin_of_solution|>
    answer_close: <|end_of_solution|>
    think_open_in_prompt: false
_saved_at: '2026-09-11T19:34:07'
